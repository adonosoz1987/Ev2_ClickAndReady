name: CI Quality Gate (DoD Andes Market)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: setup/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage pytest
    - name: Run Tests with Coverage (DoD Gate >= 70%)
      run: |
        coverage run -m unittest test_click_and_ready.py
        coverage report --fail-under=70
